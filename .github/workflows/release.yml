name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release.yml'
      - '.github/actions/setup/action.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history helps @changesets/changelog-github link commits/PRs
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # npm recommends no package-manager cache on publish builds
          enable-cache: 'false'
          registry-url: https://registry.npmjs.org

      - name: Run Tests
        run: pnpm test --maxWorkers=2

      - name: Build Package
        run: pnpm prepare

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty string forces OIDC; omitting NPM_TOKEN makes changesets fall back incorrectly
          NPM_TOKEN: ''

      # pnpm workspaces make Changesets treat this as a monorepo, so tags are
      # `@scope/name@version`. Add a SemVer alias and tidy the GitHub Release title.
      - name: Alias SemVer tag and release title
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_TAG="@edwardloopez/react-native-coachmark@${VERSION}"
          SEMVER_TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$SEMVER_TAG" >/dev/null 2>&1; then
            git tag "$SEMVER_TAG" "$PACKAGE_TAG"
            git push origin "$SEMVER_TAG"
          fi

          gh release edit "$PACKAGE_TAG" --title "$SEMVER_TAG" || true
